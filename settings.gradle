pluginManagement {
	repositories {
		maven {
			name = 'Architectury'
			url = 'https://maven.architectury.dev/'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Forge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			name = 'NeoForge'
			url = 'https://maven.neoforged.net/releases/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.6'
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'better-menu-buttons'

stonecutter {
	centralScript = 'build.gradle'
	kotlinController = false
	create(rootProject, file('versions.json5'))
}

gradle.rootProject {
	tasks.register('buildAllVariants') {
		group = 'build'
		description = 'Builds every loader and Minecraft version variant.'
		dependsOn subprojects.collect { ":${it.name}:build" }
	}
}