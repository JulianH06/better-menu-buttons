plugins {
	id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
	id 'dev.architectury.loom-no-remap' version "${architectury_loom_version}" apply false
	id 'dev.kikugie.stonecutter'
	id 'maven-publish'
}

allprojects {
	version = project.mod_version
	group = project.maven_group

	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Quilt'
			url = 'https://maven.quiltmc.org/repository/release/'
		}
		maven {
			name = 'TerraformersMC'
			url = 'https://maven.terraformersmc.com/releases/'
		}
		maven {
			name = 'Forge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			name = 'NeoForge'
			url = 'https://maven.neoforged.net/releases/'
		}
		mavenCentral()
	}
}

if (project != rootProject) {
	def variantName = stonecutter.current.project
	def loader = variantName.substring(0, variantName.indexOf('-'))
	def mcLabel = variantName.substring(variantName.indexOf('-') + 1)
	def minecraftVersions = [
			'26.2'          : '26.2',
			'26.3-snapshot3': '26.3-snapshot-3'
	]
	def minecraftLoaderVersions = [
			'26.2'          : '26.2',
			'26.3-snapshot3': '26.3-alpha.3'
	]
	def minecraftLoaderUpperBounds = [
			'26.2': '26.3-alpha.3'
	]
	def fabricApiVersions = [
			'26.2'          : '0.152.1+26.2',
			'26.3-snapshot3': '0.153.1+26.3'
	]
	def minecraftVersion = minecraftVersions[mcLabel]
	if (minecraftVersion == null) {
		throw new GradleException("Unknown Minecraft version label: ${mcLabel}")
	}
	def minecraftLoaderVersion = minecraftLoaderVersions[mcLabel]
	def minecraftRange = (loader == 'forge' || loader == 'neoforge')
			? '[26.2,26.3)'
			: (mcLabel == '26.3-snapshot3' ? "=${minecraftLoaderVersion}" : ">=26.2 <${minecraftLoaderUpperBounds[mcLabel]}")
	def quiltMinecraftLowerBound = mcLabel == '26.3-snapshot3' ? ">=${minecraftLoaderVersion}" : '>=26.2'
	def quiltMinecraftUpperBound = mcLabel == '26.3-snapshot3' ? "<=${minecraftLoaderVersion}" : "<${minecraftLoaderUpperBounds[mcLabel]}"

	layout.buildDirectory = rootProject.layout.buildDirectory.dir("variants/${project.name}")
	ext.set('loom.platform', loader)

	if (loader == 'forge' || loader == 'neoforge') {
		apply plugin: 'dev.architectury.loom-no-remap'
	} else {
		apply plugin: 'dev.architectury.loom'
	}
	apply plugin: 'maven-publish'

	base {
		archivesName = rootProject.name
	}

	sourceSets {
		main {
			java.srcDirs = [
					rootProject.file('common/src/main/java'),
					rootProject.file("${loader}/src/main/java")
			]
			resources.srcDirs = [
					rootProject.file('common/src/main/resources'),
					rootProject.file("${loader}/src/main/resources")
			]
		}
	}

	loom {
		silentMojangMappingsLicense()

		mods {
			'better-menu-buttons' {
				sourceSet sourceSets.main
			}
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${minecraftVersion}"

		if (loader == 'fabric') {
			mappings files(rootProject.file('mappings/official-mappings.jar'))
			modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
			modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersions[mcLabel]}"
			modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
		} else if (loader == 'quilt') {
			mappings files(rootProject.file('mappings/official-mappings.jar'))
			modImplementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
			modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
		} else if (loader == 'forge') {
			forge "net.minecraftforge:forge:${project.forge_version}"
		} else if (loader == 'neoforge') {
			neoForge "net.neoforged:neoforge:${project.neoforge_version}"
		}
	}

	processResources {
		def properties = [
				version              : project.version,
				minecraft_version    : minecraftVersion,
				minecraft_range      : minecraftRange,
				quilt_minecraft_lower_bound: quiltMinecraftLowerBound,
				quilt_minecraft_upper_bound: quiltMinecraftUpperBound,
				fabric_loader_version: project.fabric_loader_version,
				quilt_loader_version : project.quilt_loader_version,
				forge_loader_range   : project.forge_loader_range,
				neoforge_loader_range: project.neoforge_loader_range
		]

		inputs.properties properties
		filesMatching(['fabric.mod.json', 'quilt.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
			expand properties
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	jar {
		archiveClassifier = project.name
		inputs.property 'projectName', rootProject.name
		if (loader == 'forge') {
			manifest {
				attributes([
						'MixinConfigs': 'better-menu-buttons.client.mixins.json'
				])
			}
		}

		from(rootProject.file('LICENSE')) {
			rename { "${it}_${rootProject.name}" }
		}
	}

	tasks.matching { it.name == 'remapJar' }.configureEach {
		archiveClassifier = project.name
	}

	publishing {
		publications {
			create('mavenJava', MavenPublication) {
				from components.java
			}
		}

		repositories {
		}
	}
}